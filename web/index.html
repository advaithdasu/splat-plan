<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplatPlan: drone footage to Gaussian splats and the recovered flight path</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.min.js"
  }
}
</script>
</head>
<body>
<header>
  <a id="repo" href="https://github.com/advaithdasu/splat-plan" target="_blank" rel="noopener" aria-label="View the source on GitHub" title="View the source on GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <h1>SplatPlan</h1>
  <p>Rooms flown with a DJI Neo, rebuilt as 3D Gaussian splats, with the flight path recovered from the video alone, no other sensor data.</p>
</header>

<main>
  <nav id="tabs" aria-label="Scenes">
    <button data-scene="loft" data-title="Mohler Lab" class="active">Mohler Lab</button>
    <button data-scene="basement" data-title="HST">HST</button>
  </nav>

  <section id="stage">
   <div id="view">
    <div id="viewer" aria-label="3D viewer"></div>
    <div id="loading">Loading splat…</div>
    <div id="viewbadge" aria-live="polite"><span class="dot"></span><span id="viewbadge-text"></span></div>
    <div id="hint">Drag to orbit · right-drag to pan · scroll to zoom</div>
    <figure id="fvideo-box">
      <video id="fvideo" muted playsinline preload="auto"></video>
      <figcaption id="fvideo-cap">Drone video</figcaption>
    </figure>
   </div>
    <aside id="panel">
      <h2 id="scene-title"></h2>
      <p id="scene-facts"></p>

      <div id="flight-section">
        <h3>Flight path</h3>
        <p class="small" id="flight-facts"></p>
        <div class="transport">
          <button id="fplay" class="icon-btn" aria-label="Play" title="Play / pause (video and path together)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <input type="range" id="fslider" min="0" max="1000" value="0" step="1" aria-label="Video time">
        </div>
        <div class="small" id="ftime"></div>
        <div class="camrow">
          <div class="seg" id="camseg" role="group" aria-label="Camera">
            <button id="cam-free" aria-pressed="true" title="Orbit around the room yourself">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Free
            </button>
            <button id="cam-drone" aria-pressed="false" title="See the room from where the drone was">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>Drone
            </button>
          </div>
        </div>
      </div>

      <fieldset id="layers">
        <legend>Show</legend>
        <label><input type="checkbox" id="show-flight" checked> Flight path</label>
        <label><input type="checkbox" id="show-paths"> Planned path</label>
        <label><input type="checkbox" id="show-cams"> Keyframe positions</label>
        <div class="buttons"><button id="reset">Reset view</button></div>
      </fieldset>

      <div id="path-section">
        <h3>Planned paths</h3>
        <p class="small">Click one to compare it with the real flight.</p>
        <ol id="path-list"></ol>
        <div id="path-detail"></div>
        <div class="buttons">
          <button id="fly" class="icon-btn" disabled aria-label="Play path" title="Fly the selected path">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-stop" d="M7 7h10v10H7z"/></svg>
          </button>
        </div>
      </div>
    </aside>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
